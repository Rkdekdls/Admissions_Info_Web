<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부록2-02</title>
  <link rel="stylesheet" href="../../../css/styles.css">
  <style>body{min-height:100vh;min-height:100dvh}</style>
  <script src="../../../js/page.js"></script>
  <style>
    /* 용어 사전 표 스타일 */
    .glossary-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 3mm 0 2mm 0;
      font-size: 15px;
      border: 1px solid #E5E7EB;
      border-radius: 0;
      overflow: hidden;
      background-color: #ffffff;
    }
    
    .glossary-table th,
    .glossary-table td {
      padding: 3mm 4mm;
      text-align: left;
      border-bottom: 1px solid #E5E7EB;
      border-right: 1px solid #E5E7EB;
      vertical-align: top;
    }
    
    .glossary-table th {
      background-color: var(--color-primary);
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      padding-top: 4mm;
      padding-bottom: 4mm;
    }
    
    .glossary-table th:first-child {
      width: 25%;
    }
    
    .glossary-table th:last-child {
      width: 75%;
    }
    
    .glossary-table tbody tr:nth-child(even) {
      background-color: #FAFAFA;
    }
    
    .glossary-table tbody tr:last-child td {
      border-bottom: none;
    }
    
    .glossary-table td:first-child {
      font-size: 14.5px;
      color: var(--color-text);
      text-align: center;
      font-weight: 600;
    }
    
    .glossary-table td:last-child {
      font-size: 14.5px;
      color: var(--color-text);
      line-height: 1.6;
      text-align: left;
    }
    
    .glossary-table th:last-child,
    .glossary-table td:last-child {
      border-right: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 중제목 -->
    <h2 class="title-2">
      Chapter 2. 대입 용어 정리집
    </h2>
<!-- 페이지 하단 번호 -->
    <div class="page-footer">- 49 -</div>
  </div>
</body>
</html>
