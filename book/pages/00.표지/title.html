<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>표지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>body{min-height:100vh;min-height:100dvh}</style>
  <script src="../../js/page.js"></script>
</head>
<body class="page-title-body">
  <div class="page page-title-page">

    <!-- 🔵 배경 패턴: "고" 모티브 -->
    <div class="block-go-1"></div>
    <div class="block-go-2"></div>
    <div class="block-go-3"></div>
    <div class="block-go-4"></div>

    <!-- 📌 세로 제목 -->
    <div class="title-strip">
      <div class="title-vertical">고교생활가이드</div>
    </div>

    <!-- 🌸 태그 (포인트) -->
    <div class="tag tag-1">수시와 정시 전략</div>
    <div class="tag tag-2">전공별 과목 선택</div>
    <div class="tag tag-3">학생부 완전 정복</div>

    <!-- 🔹 우측 정보 -->
    <div class="side-info">
      <span class="side-year">2022</span>
      <span class="side-text">개정 교육과정 반영</span>
    </div>

    <!-- 로고 -->
    <div class="cover-logo">
      <img src="../../img/logo.jpg" alt="megastudy">
    </div>

    <p class="cover-copyright"><span class="cover-copyright-mark">©</span>이 책의 저작권은 입시전략연구소 진학지도서비스팀에 있습니다.</p>

  </div>
