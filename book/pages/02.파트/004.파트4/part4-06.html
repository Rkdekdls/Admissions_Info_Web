<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파트4-06</title>
  <link rel="stylesheet" href="../../../css/styles.css">
  <style>body{min-height:100vh;min-height:100dvh}</style>
  <script src="../../../js/page.js"></script>
  <style>
    .comparison-container {
      display: flex;
      gap: 6mm;
      margin-top: 2mm;
      margin-bottom: 3mm;
    }
    
    .comparison-card {
      flex: 1;
      border-radius: 0;
      padding: 5mm;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    .comparison-card.old-system {
      background-color: #ffffff;
      border: 1.5px solid #E5E7EB;
    }
    
    .comparison-card.new-system {
      background-color: #ffffff;
      border: 1.5px solid #E5E7EB;
    }
    
    .card-header {
      text-align: center;
      padding: 4mm 3mm;
      margin: -5mm -5mm 3mm -5mm;
      background-color: var(--color-primary);
      color: #ffffff;
      border-radius: 0;
      border-bottom: none;
    }
    
    .card-header.old-system {
      border-bottom: none;
    }
    
    .card-header.new-system {
      background-color: #1653c9;
      border-bottom: none;
    }
    
    .card-grade {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 1mm;
      color: #ffffff;
      text-align: center;
    }
    
    .card-year {
      font-size: 14px;
      font-weight: 500;
      opacity: 0.8;
      margin-bottom: 0mm;
      color: #ffffff;
      text-align: center;
    }
    
    .card-revision {
      display: inline-block;
      padding: 1.5mm 4mm;
      border-radius: 0;
      font-size: 12px;
      font-weight: 600;
      margin-top: 1mm;
    }
    
    .card-revision.old {
      background-color: #F3F4F6;
      color: #6B7280;
    }
    
    .card-revision.new {
      background-color: #DBEAFE;
      color: var(--color-primary-dark);
    }
    
    .section-block {
      margin-top: 2.45mm;
      margin-bottom: 2.45mm;
      background-color: #FAFAFA;
      border: 1px solid #F0F0F0;
      border-radius: 0;
      padding: 3.5mm;
    }
    
    .comparison-card .section-block:first-of-type {
      margin-top: 0;
    }
    
    .comparison-card .section-block:last-of-type {
      margin-bottom: 0.3mm;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3mm;
      padding-bottom: 3.5mm;
      border-bottom: 1.5px solid #E5E7EB;
      color: var(--color-text);
    }
    
    .section-content {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 0;
      color: var(--color-text);
    }
    
    .section-content ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    
    .section-content li {
      padding-left: 5.5mm;
      position: relative;
      margin-bottom: 2mm;
      line-height: 1.8;
    }
    
    .section-content li:last-child {
      margin-bottom: 0;
    }
    
    .section-content li::before {
      content: '•';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-primary);
      font-weight: 700;
      font-size: 18px;
      line-height: 1.3;
    }
    
    .section-content li.no-bullet {
      padding-left: 0;
      text-align: justify;
    }
    
    .section-content li.no-bullet::before {
      display: none;
    }
    
    .section-badge {
      display: inline-block;
      padding: 1.5mm 3.5mm;
      border-radius: 0;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2.5mm;
      background-color: #EFF6FF;
      color: var(--color-primary-dark);
    }
    
    .highlight-box {
      margin-top: 3mm;
      padding: 3mm;
      border-radius: 0;
      font-size: 12.5px;
      line-height: 1.7;
      background-color: #F0F9FF;
      border-left: 3px solid var(--color-primary);
      color: var(--color-text);
    }
    
    .intro-text {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--color-text-light);
      margin-bottom: 4mm;
      text-align: center;
      padding: 3mm 4mm;
      background-color: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 0;
    }
    
    .conclusion-box {
      margin-top: 2.5mm;
      border: 1px solid #3B82F6;
      padding: 2.5mm 2mm;
      font-size: 13.5px !important;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      background-color: #FAFAFA;
      color: #3B82F6;
      border-radius: 0;
    }
    
    /* 교육과정 편제표 축소 스타일 */
    .comparison-table.curriculum-table {
      font-size: 14px !important;
      line-height: 1.4 !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      border: 1px solid #E5E7EB !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      background-color: #ffffff !important;
      table-layout: fixed !important;
      width: 100% !important;
    }
    
    .comparison-table.curriculum-table th,
    .comparison-table.curriculum-table td {
      padding: 1mm 1.6mm !important;
      font-size: 14px !important;
      line-height: 1.5 !important;
      border-bottom: 1px solid #E5E7EB !important;
      border-right: 1px solid #E5E7EB !important;
      border-top: none !important;
      border-left: none !important;
      text-align: center !important;
      vertical-align: middle !important;
      margin: 0 !important;
    }
    
    /* 이중 테두리 방지 - 첫 번째 열은 왼쪽 테두리 제거 */
    .comparison-table.curriculum-table th:first-child,
    .comparison-table.curriculum-table td:first-child {
      border-left: none !important;
    }
    
    .comparison-table.curriculum-table thead th {
      padding: 1.6mm 1.6mm !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      background-color: var(--color-primary) !important;
      color: #ffffff !important;
      border-bottom: 1px solid #E5E7EB !important;
      border-right: 1px solid #E5E7EB !important;
      border-top: none !important;
      border-left: none !important;
      text-align: center !important;
      vertical-align: middle !important;
    }
    
    /* 마지막 컬럼 헤더의 오른쪽 테두리 제거 */
    .comparison-table.curriculum-table thead th:last-child {
      border-right: none !important;
    }
    
    .comparison-table.curriculum-table thead th * {
      font-size: 14px !important;
    }
    
    .comparison-table.curriculum-table tbody tr {
      height: auto !important;
      background-color: #ffffff !important;
    }
    
    .comparison-table.curriculum-table tbody td {
      padding: 2mm 2mm !important;
      font-size: 14px !important;
      font-weight: 400 !important;
      border-bottom: 1px solid #E5E7EB !important;
      border-right: 1px solid #E5E7EB !important;
      border-top: none !important;
      border-left: none !important;
      background-color: #ffffff !important;
      color: var(--color-text) !important;
      text-align: center !important;
    }
    
    /* 수능 성적표: 선택 과목/표준점수/백분위/등급 행 셀 높이 통일 (더 구체적인 선택자) */
    .comparison-table.curriculum-table.certification-table tbody tr:nth-child(3) td,
    .comparison-table.curriculum-table.certification-table tbody tr:nth-child(4) td,
    .comparison-table.curriculum-table.certification-table tbody tr:nth-child(5) td,
    .comparison-table.curriculum-table.certification-table tbody tr:nth-child(6) td {
      padding: 3mm 2mm !important;
      height: 1.6mm !important;
      line-height: 5mm !important;
      vertical-align: middle !important;
      box-sizing: content-box !important;
    }
    
    /* 마지막 컬럼 데이터 셀의 오른쪽 테두리 제거 */
    .comparison-table.curriculum-table tbody td:last-child {
      border-right: none !important;
    }
    
    .comparison-table.curriculum-table tbody td * {
      font-size: 14px !important;
    }
    
    /* 모든 행은 하얀색 배경 */
    .comparison-table.curriculum-table tbody tr {
      background-color: #ffffff !important;
    }
    
    .comparison-table.curriculum-table tbody tr td {
      background-color: #ffffff !important;
    }
    
    /* 마지막 컬럼 오른쪽 모서리 이중선 제거 */
    .comparison-table.curriculum-table th:last-child,
    .comparison-table.curriculum-table td:last-child,
    .comparison-table.curriculum-table thead th:last-child,
    .comparison-table.curriculum-table tbody td:last-child {
      border-right: none !important;
    }
    
    /* 마지막 행은 하단 선 제거 (바깥 테두리만 남기기) */
    .comparison-table.curriculum-table tbody tr:last-child td {
      border-bottom: none !important;
    }
    
    /* 모든 셀의 border-radius 제거 - 테이블 바깥쪽 테두리만 둥글게 */
    .comparison-table.curriculum-table th,
    .comparison-table.curriculum-table td {
      border-top-left-radius: 0 !important;
      border-top-right-radius: 0 !important;
      border-bottom-left-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
    }
    
    /* 첫 번째 행의 첫 번째 셀 - 상단 왼쪽 모서리 */
    .comparison-table.curriculum-table thead tr:first-child th:first-child {
      border-top-left-radius: 0 !important;
    }
    
    /* 첫 번째 행의 마지막 셀 - 상단 오른쪽 모서리 */
    .comparison-table.curriculum-table thead tr:first-child th:last-child {
      border-top-right-radius: 0 !important;
    }
    
    /* 마지막 행의 첫 번째 셀 - 하단 왼쪽 모서리 */
    .comparison-table.curriculum-table tbody tr:last-child td:first-child {
      border-bottom-left-radius: 0 !important;
    }
    
    /* 마지막 행의 마지막 셀 - 하단 오른쪽 모서리 */
    .comparison-table.curriculum-table tbody tr:last-child td:last-child {
      border-bottom-right-radius: 0 !important;
      border-right: none !important;
    }
    
    /* 교시 컬럼(1번째) 너비 줄이기 */
    .comparison-table.curriculum-table th:nth-child(1),
    .comparison-table.curriculum-table td:nth-child(1) {
      width: 10% !important;
    }
    
    /* 문항 수 컬럼(4번째) 너비 */
    .comparison-table.curriculum-table th:nth-child(4),
    .comparison-table.curriculum-table td:nth-child(4) {
      width: 12% !important;
    }
    
    /* ✅ 수능 성적표: 텍스트 안 잘리게 (fixed -> auto) */
    .comparison-table.curriculum-table.certification-table {
      table-layout: fixed !important;
    }
    
    /* ✅ 셀 내용 줄바꿈 허용 + 말줄임 제거 */
    .comparison-table.curriculum-table.certification-table th,
    .comparison-table.curriculum-table.certification-table td {
      white-space: normal !important;  /* 줄바꿈 허용 */
      overflow: visible !important;    /* 잘라내기 해제 */
      text-overflow: clip !important;  /* … 제거 */
      word-break: keep-all !important; /* 한글 단어 중간 끊김 방지 */
      overflow-wrap: anywhere !important; /* 너무 길면 안전하게 줄바꿈 */
    }
    
    
    /* 왼쪽 라벨(선택 과목/표준점수/백분위/등급) 컬럼만 살짝 넓힘 */
    .comparison-table.curriculum-table.certification-table colgroup col:first-child {
      width: 14% !important;
    }
    
    /* 대각선 패턴 스타일 */
    .diagonal-line {
      position: relative;
      overflow: hidden;
      background: #ffffff !important;
    }
    
    .diagonal-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom right,
        transparent calc(50% - 0.5px),
        #9CA3AF calc(50% - 0.5px),
        #9CA3AF calc(50% + 0.5px),
        transparent calc(50% + 0.5px)
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 중제목 (연속) -->
    <h2 class="title-2">
      Chapter 4. 수능의 입시 반영 방식
    </h2>
    
    <!-- 페이지 하단 번호 -->
    <div class="page-footer">- 30 -</div>
  </div>
</body>
</html>
