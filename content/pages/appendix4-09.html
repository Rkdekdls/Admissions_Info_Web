<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부록4-09</title>
  <link rel="stylesheet" href="../../../css/styles.css">
  <style>body{min-height:100vh;min-height:100dvh}</style>
  <script src="../../../js/page.js"></script>
  <style>
    .subject-table-wrapper {
      margin-top: 3mm;
      width: 100%;
      overflow: visible;
    }
    
    .subject-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
      background-color: #ffffff;
      border-radius: 0;
      overflow: hidden;
      table-layout: fixed;
      border: 1px solid #E5E7EB;
    }
    
    .subject-table th,
    .subject-table td {
      padding: 2mm 1.5mm;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #E5E7EB;
      border-right: 1px solid #E5E7EB;
      word-break: keep-all;
      white-space: normal;
      overflow: visible;
    }
    
    /* 수학/과학 헤더 셀(1행 2번째, 3번째 th) 높이 조정 - appendix4-05.html과 동일하게 */
    .subject-table thead tr:first-child th:nth-child(2),
    .subject-table thead tr:first-child th:nth-child(3) {
      padding-top: 0.5mm;
      padding-bottom: 0.5mm;
      line-height: 1.1;
    }
    
    /* 데이터 셀의 왼쪽 패딩 증가 */
    .subject-table td {
      padding-left: 2.5mm;
    }
    
    /* 마지막 컬럼은 오른쪽 선 제거 */
    .subject-table th:last-child,
    .subject-table td:last-child {
      border-right: none;
    }
    
    /* 마지막 행은 하단 선 제거 */
    .subject-table tbody tr:last-child td {
      border-bottom: none;
    }
    
    /* 첫 번째 행의 첫 번째 셀 - 상단 왼쪽 모서리 */
    .subject-table thead tr:first-child th:first-child {
      border-top-left-radius: 0;
    }
    
    /* 첫 번째 행의 마지막 셀 - 상단 오른쪽 모서리 */
    .subject-table thead tr:first-child th:last-child {
      border-top-right-radius: 0;
    }
    
    /* 마지막 행의 마지막 셀 - 하단 오른쪽 모서리 */
    .subject-table tbody tr:last-child td:last-child {
      border-bottom-right-radius: 0;
    }
    
    /* 헤더 스타일 - 첫 번째 행 */
    .subject-table thead tr:first-child th {
      background-color: var(--color-primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      padding: 3mm 1.5mm !important;
      text-align: center;
      vertical-align: middle;
      word-break: keep-all;
      white-space: normal;
      overflow: visible;
    }
    
    /* 모든 헤더 기본 스타일 */
    .subject-table th {
      background-color: var(--color-primary);
      color: #ffffff;
      font-weight: 600;
      text-align: center;
      word-break: keep-all;
      white-space: normal;
      overflow: visible;
    }
    
    /* 헤더 스타일 - 두 번째 행 */
    .subject-table thead tr:nth-child(2) th {
      background-color: var(--color-primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 2mm 1.5mm !important;
      text-align: center;
      vertical-align: middle;
      word-break: keep-all;
      white-space: normal;
      overflow: visible;
    }
    
    /* 단과대학(첫 번째 열) 너비 */
    .subject-table th:first-child {
      width: 13%;
    }
    
    .subject-table td:first-child {
      width: 20%;
    }
    
    /* 단과대학 이름이 들어간 셀만 배경 + 볼드 처리 */
    .subject-table td.college-cell {
      background-color: #FAFAFA;
      font-weight: 600;
    }
    
    /* 농업생명과학대학 셀(마지막 단과대학, rowspan=2)의 하단 이중선 제거 */
    .subject-table td.college-cell-last {
      border-bottom: none;
    }
    
    /* 모집단위, 소양영역 컬럼 너비 */
    .subject-table th:nth-child(2),
    .subject-table th:nth-child(3),
    .subject-table td:nth-child(2),
    .subject-table td:nth-child(3) {
      width: 23%;
    }
    
    /* 역량영역 컬럼 너비 (더 넓게) */
    .subject-table th:nth-child(4),
    .subject-table td:nth-child(4) {
      width: 34%;
    }
    
    /* 선택 과목 내부 구분 */
    .subject-item {
      display: block;
      margin-bottom: 0.8mm;
      word-break: keep-all;
      white-space: normal;
      line-height: 1.4;
    }
    
    /* 선택 과목 셀의 subject-item은 인라인으로 표시 */
    .subject-table td:nth-child(2) .subject-item,
    .subject-table td:nth-child(3) .subject-item,
    .subject-table td:nth-child(4) .subject-item {
      display: inline;
      margin-bottom: 0;
    }
    
    /* 선택 과목 셀의 쉼표 뒤 공백 추가 */
    .subject-table td:nth-child(2) .subject-item::after,
    .subject-table td:nth-child(3) .subject-item::after,
    .subject-table td:nth-child(4) .subject-item::after {
      content: '';
    }
    
    .subject-item:last-child {
      margin-bottom: 0;
    }
    
    /* 빨간색 강조 스타일 */
    .subject-highlight {
      color: #DC2626;
      font-weight: 500;
    }
    
    .subject-type-label {
      font-weight: 600;
      color: var(--color-text);
      margin-top: 1mm;
      margin-bottom: 0.5mm;
      display: block;
    }
    
    .subject-type-label:first-child {
      margin-top: 0;
    }
    
    .subject-type-general {
      color: var(--color-text);
    }
    
    .subject-type-career {
      color: var(--color-text);
    }
    
    .subject-type-convergence {
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 중제목 -->
    <h2 class="title-2">
      Chapter 4. 대학별 전공 연계 과목
    </h2>
<!-- 페이지 하단 번호 -->
    <div class="page-footer">- 63 -</div>
  </div>
</body>
</html>
